<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #181a20; --text: #e8e9ee; --dim: #6b6f7c;
    --accent: #ffd54a; --me: #4fc3f7; --ok: #66bb6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hidden { display: none !important; }

  /* Login */
  #login { max-width: 480px; margin: 0 auto; padding: 32px 20px; }
  #login h1 { font-size: 1.6rem; margin: 0 0 6px; }
  #login p { color: var(--dim); margin: 0 0 24px; }
  .rolebtn { display: block; width: 100%; padding: 18px; margin: 0 0 12px; border: 2px solid #2a2d37;
    border-radius: 12px; background: var(--panel); color: var(--text); font-size: 1.2rem; text-align: left; cursor: pointer; }
  .rolebtn:active { border-color: var(--accent); }
  .rolebtn small { float: right; color: var(--ok); }
  .rolebtn.director { border-style: dashed; color: var(--dim); }
  .rolebtn.picked { border-color: var(--me); background: rgba(79,195,247,.10); }
  .rolebtn.go { background: var(--accent); color: #111; border-color: transparent; font-weight: 700; text-align: center; }
  .rolebtn.go:disabled { opacity: .35; }
  .linkbtn { display: block; margin: 0 0 18px; padding: 8px 0; background: none; border: 0; color: var(--dim);
    font-size: 1rem; text-decoration: underline; cursor: pointer; }

  /* Prompter */
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid #2a2d37; flex-wrap: wrap; padding-top: max(10px, env(safe-area-inset-top)); }
  header .who { font-weight: 700; color: var(--me); }
  header .online { color: var(--dim); font-size: .85rem; flex: 1; min-width: 120px; }
  header .online b { color: var(--ok); font-weight: 600; }
  header button.small { background: none; border: 1px solid #2a2d37; color: var(--dim); border-radius: 8px; padding: 6px 10px; }
  #status { font-size: .8rem; color: var(--dim); }
  #status.bad { color: #ef5350; }

  #director { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 14px; background: #14161b; border-bottom: 1px solid #2a2d37; }
  #director button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #2a2d37; background: var(--panel); color: var(--text); }
  #dScript { flex-basis: 100%; padding: 8px; border-radius: 8px; border: 1px solid #2a2d37; background: var(--panel); color: var(--text); font-size: 1rem; }
  #music { flex-basis: 100%; display: flex; align-items: center; gap: 10px; }
  #music button { flex: 0 0 auto; padding: 8px 12px; }
  #music button.attn { border-color: var(--accent); color: var(--accent); }
  #dVol { flex: 0 0 110px; width: 110px; }
  #dNow { flex: 1; min-width: 0; color: var(--dim); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #scroll { flex: 1; overflow-y: auto; padding: 40vh 18px 40vh; scroll-behavior: smooth; }
  .line { max-width: 820px; margin: 0 auto 18px; padding: 12px 16px; border-radius: 12px;
    border-left: 6px solid transparent; font-size: 1.35rem; line-height: 1.45; transition: opacity .2s, transform .2s; }
  .line .who { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  .line.past { opacity: .35; }
  .line.future { opacity: .75; }
  .line.mine { border-left-color: var(--me); background: rgba(79,195,247,.08); }
  .line.mine .who { color: var(--me); }
  .line.current { opacity: 1; background: rgba(255,213,74,.14); border-left-color: var(--accent);
    font-size: 1.8rem; transform: scale(1.01); }
  .line.current .who { color: var(--accent); }
  .line.current.mine { background: rgba(255,213,74,.22); box-shadow: 0 0 0 2px var(--accent); }
  .line.dir { font-style: italic; color: var(--dim); font-size: 1.05rem; text-align: center; border: 0; background: none; }
  .line.clickable { cursor: pointer; }
  #end { text-align: center; color: var(--dim); padding: 30px; }

  #bar { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid #2a2d37; }
  #done { width: 100%; padding: 22px; font-size: 1.4rem; font-weight: 700; border: 0; border-radius: 14px;
    background: #2a2d37; color: var(--dim); }
  #done.ready { background: var(--accent); color: #111; }
  #done:disabled { opacity: .9; }
</style>
</head>
<body>

<div id="login">
  <h1>Teleprompter</h1>
  <p>Choose your role to join.</p>
  <div id="rolelist"></div>
</div>

<div id="app" class="hidden">
  <header>
    <span class="who" id="me"></span>
    <span class="online" id="online"></span>
    <span id="status">connecting…</span>
    <button class="small" id="logout">Switch role</button>
  </header>
  <div id="director" class="hidden">
    <select id="dScript" class="hidden" aria-label="Script"></select>
    <button id="dBack">◀ Back</button>
    <button id="dNext">Next ▶</button>
    <button id="dReset">Restart</button>
    <button id="dReload">Reload script</button>
    <div id="music">
      <button id="dMusic">♪ Tap to enable</button>
      <input id="dVol" type="range" min="0" max="1" step="0.05" aria-label="Music volume">
      <span id="dNow"></span>
    </div>
  </div>
  <div id="scroll"><div id="lines"></div><div id="end" class="hidden">— End of script —</div></div>
  <div id="bar"><button id="done" disabled>Waiting…</button></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // The roles this device plays: one for most people, two or more when someone covers for an absent
  // actor. Saved as a JSON list (a plain "ANNA" saved by an older version still loads).
  const loadSaved = () => {
    let s = null;
    try { s = localStorage.getItem('tp_role'); } catch {}
    if (!s) return [];
    try { const v = JSON.parse(s); return (Array.isArray(v) ? v : [v]).map(String); } catch { return [s]; }
  };
  const saveRoles = list => { try { localStorage.setItem('tp_role', JSON.stringify(list)); } catch {} };
  let ws, myRoles = loadSaved(), roles = [], director = 'Director';
  let script = [], current = 0, online = [], lineEls = [], lastMyTurn = -1, tracks = [];
  let scripts = [], activeScript = null;
  let multi = false; const picked = new Set(); // login screen: "playing more than one role" mode
  const isDirector = () => myRoles.length === 1 && myRoles[0] === director;
  const isMine = r => myRoles.includes(r);

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = () => {
      $('status').textContent = 'live'; $('status').className = '';
      if (myRoles.length) ws.send(JSON.stringify({ type: 'login', roles: myRoles }));
    };
    ws.onclose = () => {
      $('status').textContent = 'reconnecting…'; $('status').className = 'bad';
      setTimeout(connect, 1000);
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'roles') { roles = m.roles; director = m.director; renderLogin(); }
      else if (m.type === 'welcome') {
        myRoles = m.roles; saveRoles(myRoles); // what the server accepted (roles missing from the script are dropped)
        showApp();
      }
      else if (m.type === 'script') {
        script = m.lines; roles = m.roles; tracks = m.tracks || []; lastMyTurn = -1;
        if (typeof m.current === 'number') current = m.current; // keep script and position in step
        scripts = m.scripts || []; activeScript = m.active;
        renderScriptPicker(); renderScript();
      }
      else if (m.type === 'state') { current = m.current; online = m.online; update(); }
      else if (m.type === 'error') { alert(m.message); if (!lineEls.length) logout(); }
    };
  }

  function join(list) {
    myRoles = list; saveRoles(list);
    ws.send(JSON.stringify({ type: 'login', roles: list }));
    music.enable(); // this tap is the user gesture browsers require before audio may start
  }

  function renderLogin() {
    const box = $('rolelist'); box.innerHTML = '';
    for (const r of [...picked]) if (!roles.includes(r)) picked.delete(r); // the script may have changed
    const btn = (text, cls, onclick) => {
      const b = document.createElement('button');
      b.className = cls; b.textContent = text; b.onclick = onclick;
      box.appendChild(b);
      return b;
    };
    roles.forEach(r => {
      const on = multi && picked.has(r);
      btn((multi ? (on ? '☑ ' : '☐ ') : '') + r, 'rolebtn' + (on ? ' picked' : ''), () => {
        if (!multi) return join([r]);                      // the usual case: one tap and you are in
        if (picked.has(r)) picked.delete(r); else picked.add(r);
        renderLogin();
      });
    });
    if (multi) {
      const list = roles.filter(r => picked.has(r));       // script order, so "ANNA + BOB" is stable
      const go = btn(list.length ? 'Join as ' + list.join(' + ') : 'Pick the roles you will play', 'rolebtn go', () => join(list));
      go.disabled = !list.length;
    }
    if (roles.length > 1) {
      const t = btn(multi ? 'Just one role' : 'Playing more than one role?', 'linkbtn', () => { multi = !multi; picked.clear(); renderLogin(); });
      t.id = 'multiToggle';
    }
    btn('Director (control everything)', 'rolebtn director', () => join([director]));
  }

  function showApp() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('me').textContent = myRoles.join(' + ');
    $('director').classList.toggle('hidden', !isDirector());
  }

  function logout() {
    music.stop();
    try { localStorage.removeItem('tp_role'); } catch {}
    myRoles = []; multi = false; picked.clear(); lastMyTurn = -1;
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    ws.close(); // reconnects fresh and shows the role list
  }

  function renderScriptPicker() {
    const sel = $('dScript');
    sel.innerHTML = '';
    for (const s of scripts) {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.name;
      sel.appendChild(o);
    }
    sel.value = activeScript;
    sel.classList.toggle('hidden', scripts.length < 2); // nothing to pick with a single script
  }

  function renderScript() {
    const box = $('lines'); box.innerHTML = ''; lineEls = [];
    script.forEach((l, i) => {
      const d = document.createElement('div');
      if (l.type === 'direction') {
        d.className = 'line dir'; d.textContent = '(' + l.text + ')';
      } else {
        d.className = 'line' + (isMine(l.role) ? ' mine' : '');
        const w = document.createElement('span'); w.className = 'who'; w.textContent = l.role;
        d.appendChild(w); d.appendChild(document.createTextNode(l.text));
        if (isDirector()) { d.classList.add('clickable'); d.onclick = () => send({ type: 'jump', index: i }); }
      }
      box.appendChild(d); lineEls.push(d);
    });
    update();
  }

  function update() {
    if (!lineEls.length) return;
    lineEls.forEach((el, i) => {
      if (script[i].type === 'direction') { el.classList.toggle('past', i < current); return; }
      el.classList.toggle('past', i < current);
      el.classList.toggle('current', i === current);
      el.classList.toggle('future', i > current);
    });
    $('end').classList.toggle('hidden', current < script.length);

    const cur = script[current];
    const myTurn = !!cur && cur.type === 'line' && isMine(cur.role);
    const canAct = myTurn || (isDirector() && !!cur);
    const btn = $('done');
    btn.disabled = !canAct;
    btn.classList.toggle('ready', canAct);
    btn.textContent = !cur ? 'Finished'
      : myTurn ? (myRoles.length > 1 ? 'Done as ' + cur.role + ' — next line ▶' : 'Done — next line ▶')
      : isDirector() ? 'Skip ' + cur.role + '’s line ▶'
      : !myRoles.some(r => roles.includes(r)) ? 'No lines for you in this script'
      : 'Waiting for ' + cur.role + '…';
    // Buzz once per line that is yours, so covering two roles still gets a nudge for each turn.
    if (myTurn && current !== lastMyTurn && navigator.vibrate) navigator.vibrate([200, 80, 200]);
    lastMyTurn = myTurn ? current : -1;

    $('online').innerHTML = 'Online: ' + (online.length ? online.map(r => '<b>' + esc(r) + '</b>').join(', ') : 'nobody');

    const target = lineEls[current] || $('end');
    target.scrollIntoView({ block: 'center' });

    music.sync();
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

  // ---------- Director background music ----------
  // Stage directions that mention "music" are cues:
  //   [Music: tense]   (Calm music fades in.)   [Music: stop]   [Music fades out.]
  // A cue names a track from public/music/ (soft-piano.mp3 -> "soft piano") or stops the music.
  // Music follows the current line: it is whatever the last cue BEFORE that line asked for, so
  // Back / jump / restart land on the right track too. Only the Director's device plays it.

  // --- cue-parsing:start
  const STOP_RE = /\b(stops?|stopped|silence|ends?|cuts?|fad(?:es?|ed|ing) (?:out|away))\b/i;
  const START_RE = /\b(starts?|begins?|plays?|playing|swells?|rises?|resumes?|enters?|fad(?:es?|ed|ing) in)\b/i;
  const SLOW_RE = /\b(slow(?:ly)?|fad(?:es?|ed|ing))\b/i;
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // null = not a music cue; otherwise { track, fade } | { stop: true, fade } | { unknown: sentence }
  function parseCue(text, tracks) {
    // Look only at the sentence that mentions music, so "End of scene." can't stop it.
    const s = text.split(/[.;!?]+/).filter(p => /\bmusic\b/i.test(p)).pop();
    if (!s) return null;
    const t = s.toLowerCase().replace(/[-_]+/g, ' ');
    const fade = SLOW_RE.test(t) ? 4 : 1.5; // seconds
    const hit = tracks
      .filter(k => new RegExp('\\b' + escRe(k.name) + '\\b').test(t))
      .sort((a, b) => b.name.length - a.name.length)[0];
    if (STOP_RE.test(t) && !(hit && START_RE.test(t))) return { stop: true, fade };
    if (hit) return { track: hit, fade };
    return { unknown: s.trim() };
  }

  // The cue in force while the script is waiting on line `current`.
  function activeCue(script, current, tracks) {
    let cue = null, unknown = null;
    for (let i = 0; i < Math.min(current, script.length); i++) {
      if (script[i].type !== 'direction') continue;
      const c = parseCue(script[i].text, tracks);
      if (!c) continue;
      if (c.unknown) unknown = c.unknown; else { cue = c; unknown = null; }
    }
    return { cue, unknown };
  }
  // --- cue-parsing:end

  const music = (() => {
    let ctx = null, master = null, blocked = false;
    let playing = null;                    // file name of the track that should be audible
    let wanted = { track: null, fade: 1.5 }, note = '';
    let muted = localStorage.getItem('tp_music_muted') === '1';
    let vol = parseFloat(localStorage.getItem('tp_music_vol'));
    if (!(vol >= 0 && vol <= 1)) vol = 0.7;
    const loaded = {};                     // file -> { audio, gain, timer, active, unlocked }
    const ready = () => !!ctx && !blocked && ctx.state === 'running';
    let enabledByThisTap = false;          // set by the capture-phase tap handler below

    // Web Audio (not audio.volume) so fades and the volume slider also work on iPhones.
    function ensureCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
        ctx.onstatechange = renderBar;
        master = ctx.createGain();
        master.connect(ctx.destination);
        applyVolume();
      }
      if (ctx.state !== 'running') ctx.resume().then(renderBar, () => {});
      return true;
    }
    function applyVolume() { if (master) master.gain.value = muted ? 0 : vol; }

    function load(track) {
      let t = loaded[track.file];
      if (!t) {
        const audio = new Audio('/music/' + encodeURIComponent(track.file));
        audio.loop = true;
        audio.preload = 'auto';
        const gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(audio).connect(gain).connect(master);
        t = loaded[track.file] = { audio, gain, timer: null, active: false, unlocked: false };
      }
      return t;
    }
    function ramp(t, to, secs) {
      const now = ctx.currentTime;
      t.gain.gain.cancelScheduledValues(now);
      t.gain.gain.setValueAtTime(t.gain.gain.value, now);
      t.gain.gain.linearRampToValueAtTime(to, now + Math.max(secs, 0.05));
    }
    function startTrack(track, secs) {
      const t = load(track);
      clearTimeout(t.timer);
      t.active = true;
      if (t.audio.paused) t.audio.currentTime = 0; // start from the top, not where it was left
      const p = t.audio.play();
      if (p && p.catch) p.catch(() => { blocked = true; renderBar(); });
      ramp(t, 1, secs);
    }
    function stopTrack(file, secs) {
      const t = loaded[file];
      if (!t) return;
      t.active = false;
      ramp(t, 0, secs);
      clearTimeout(t.timer);
      t.timer = setTimeout(() => { if (!t.active) t.audio.pause(); }, secs * 1000 + 150);
    }
    // iOS only lets a script start a media element that has already been played inside a tap,
    // so on a tap we silently "prime" every track not primed yet (its gain is 0).
    function unlockNew() {
      if (!ctx) return;
      for (const k of tracks) {
        const t = load(k);
        if (t.unlocked) continue;
        t.unlocked = true;
        const p = t.audio.play();
        if (p && p.then) p.then(() => { if (!t.active) t.audio.pause(); }, () => { t.unlocked = false; });
      }
    }

    function apply() {
      if (!isDirector()) return;
      if (ctx) {
        const want = wanted.track ? wanted.track.file : null;
        if (want !== playing) {
          if (playing) stopTrack(playing, wanted.fade);
          if (want) startTrack(wanted.track, wanted.fade);
          playing = want;
        }
      }
      renderBar();
    }
    function sync() { // called on every state/script update; does nothing unless the cue changed
      if (!isDirector()) return;
      const { cue, unknown } = activeCue(script, current, tracks);
      note = unknown ? 'no file for “' + unknown.slice(0, 40) + '”' : '';
      wanted = { track: (cue && cue.track) || null, fade: cue ? cue.fade : 1.5 };
      apply();
    }
    function enable() { // must be called from a tap or key press
      if (!isDirector() || !ensureCtx()) return;
      blocked = false;
      unlockNew();
      const t = playing && loaded[playing];
      if (t && t.audio.paused) { // a cue fired before audio was allowed: start it now
        t.active = true;
        t.audio.play().catch(() => { blocked = true; renderBar(); });
      }
      apply();
    }
    function toggle() {
      if (enabledByThisTap) return;        // this very tap just turned audio on; don't also mute it
      if (!ready()) return enable();
      muted = !muted;
      localStorage.setItem('tp_music_muted', muted ? '1' : '0');
      applyVolume(); renderBar();
    }
    function setVolume(v) {
      vol = Math.min(1, Math.max(0, v));
      muted = false;
      localStorage.setItem('tp_music_vol', String(vol));
      localStorage.setItem('tp_music_muted', '0');
      applyVolume(); renderBar();
    }
    function stop() { // leaving the Director role
      if (playing) stopTrack(playing, 0.3);
      playing = null; wanted = { track: null, fade: 0.3 }; note = '';
    }
    function renderBar() {
      const needTap = !ready();
      const b = $('dMusic');
      b.textContent = needTap ? '♪ Tap to enable' : muted ? '♪ Muted' : '♪ On';
      b.classList.toggle('attn', needTap);
      $('dNow').textContent = note || (wanted.track ? '♪ ' + wanted.track.name
        : tracks.length ? 'no music' : 'no tracks in public/music');
    }

    // Any tap or key press by the Director (re)enables audio if the browser has suspended it.
    const gesture = () => {
      if (!isDirector()) return;
      enabledByThisTap = !ready();
      if (enabledByThisTap) enable(); else unlockNew();
    };
    document.addEventListener('click', gesture, true);
    document.addEventListener('keydown', gesture, true);

    return { sync, enable, toggle, stop, setVolume, get volume() { return vol; } };
  })();
  $('dMusic').onclick = () => music.toggle();
  $('dVol').oninput = e => music.setVolume(parseFloat(e.target.value));
  $('dVol').value = music.volume;

  $('done').onclick = () => send({ type: 'done' });
  $('logout').onclick = logout;
  $('dBack').onclick = () => send({ type: 'back' });
  $('dNext').onclick = () => send({ type: 'done' });
  $('dReset').onclick = () => { if (confirm('Restart from the first line?')) send({ type: 'reset' }); };
  $('dReload').onclick = () => { if (confirm('Reload the scripts from disk and restart?')) send({ type: 'reload' }); };
  $('dScript').onchange = e => {
    const sel = e.target, name = sel.options[sel.selectedIndex].textContent;
    if (confirm('Switch to “' + name + '”? Everyone restarts from its first line.')) send({ type: 'use', id: sel.value });
    else sel.value = activeScript; // cancelled: put the picker back
  };
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !$('done').disabled) { e.preventDefault(); send({ type: 'done' }); }
  });

  connect();
})();
</script>
</body>
</html>
